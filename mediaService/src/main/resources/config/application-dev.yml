# Développement local : Postgres installé sur la machine, MinIO sur localhost:9000.
# Créer la base une fois : CREATE DATABASE lingua_media;

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/lingua_media
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:root}

logging:
  level:
    com.lingua: DEBUG

application:
  security:
    jwt:
      # Secret de développement uniquement, identique à celui du gateway.
      base64-secret: wTI9sJJNSLyAX2rO5rIXc/KAGgRYvzuz4OLLpefm035uCPdL4reosAqsc8WoFh810P0XpyO7kPzzzLOeXGqunA==
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    public-url: ${MINIO_PUBLIC_URL:http://localhost:9000}
    access-key: ${MINIO_ROOT_USER:minioadmin}
    secret-key: ${MINIO_ROOT_PASSWORD:minioadmin}
