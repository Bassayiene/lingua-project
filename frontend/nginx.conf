server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Images (10 Mo) and sounds (5 Mo) are uploaded through this proxy
    client_max_body_size 60m;

    location /api/ {
        proxy_pass http://gateway:8080;
        # Host with its port: the gateway compares it with the Origin header to tell
        # a same-origin request from a cross-origin one
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }
}
