server:
  port: 8081
  # Derrière le gateway : respecter les en-têtes X-Forwarded-*
  forward-headers-strategy: framework

spring:
  application:
    name: learning
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  liquibase:
    change-log: classpath:config/liquibase/master.xml
  data:
    web:
      pageable:
        max-page-size: 100

management:
  endpoints:
    web:
      base-path: /management
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

application:
  attempt:
    # Tolérance après la fin du chrono, pour absorber le délai réseau
    grace-seconds: 2
