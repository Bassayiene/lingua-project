server:
  port: 8080

spring:
  application:
    name: gateway
  profiles:
    default: dev
  webflux:
    problemdetails:
      enabled: true
  liquibase:
    change-log: classpath:config/liquibase/master.xml
  cloud:
    gateway:
      # L'en-tête Authorization est transmis tel quel : chaque service revalide le JWT.
      routes:
        - id: learning
          uri: ${application.services.learning}
          predicates:
            - Path=/api/languages/**,/api/categories/**,/api/questions/**,/api/attempts/**,/api/scores/**,/api/settings/**,/api/admin/languages/**,/api/admin/categories/**,/api/admin/questions/**,/api/admin/settings/**
        - id: media
          uri: ${application.services.media}
          predicates:
            - Path=/api/media/**
        # Documentation OpenAPI des services, agrégée dans le Swagger du gateway
        - id: learning-docs
          uri: ${application.services.learning}
          predicates:
            - Path=/services/learning/v3/api-docs
          filters:
            - StripPrefix=2
        - id: media-docs
          uri: ${application.services.media}
          predicates:
            - Path=/services/media/v3/api-docs
          filters:
            - StripPrefix=2

management:
  endpoints:
    web:
      base-path: /management
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    urls:
      - name: gateway
        url: /v3/api-docs
      - name: learning
        url: /services/learning/v3/api-docs
      - name: media
        url: /services/media/v3/api-docs

application:
  security:
    jwt:
      # Durée de validité du token : 24 h, ou 30 jours avec "rememberMe"
      token-validity-in-seconds: 86400
      token-validity-in-seconds-for-remember-me: 2592000
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
